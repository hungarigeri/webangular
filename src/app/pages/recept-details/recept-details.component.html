<ng-container *ngIf="recipe; else notFound">
  <mat-card class="recipe-detail-card">
    <!-- Back button with better positioning -->
    <div class="card-header">
      <button mat-icon-button class="back-button" (click)="goBack()" aria-label="Vissza">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <mat-card-header>
        <mat-card-title>{{ recipe.title }}</mat-card-title>
        <mat-card-subtitle class="recipe-meta">
          <span>
            <mat-icon aria-hidden="true">schedule</mat-icon>
            {{ recipe.prepTime + recipe.cookTime }} perc
          </span>
          <span>
            <mat-icon aria-hidden="true">restaurant</mat-icon> 
            {{ recipe.difficulty }}
          </span>
        </mat-card-subtitle>
      </mat-card-header>
    </div>

    <!-- Main image -->
<div class="image-container">
  <img mat-card-image [src]="recipe.image" class="recipe-image">
</div>

    <!-- YouTube video with responsive container -->
    <div class="video-container" *ngIf="recipe.ytlink">
      <youtube-player
        [videoId]="recipe.ytlink"
        [width]="'100%'"
        [height]="'400'"
      ></youtube-player>
    </div>

    <mat-card-content>
      <!-- Description -->
      <section aria-labelledby="description-heading">
        <h2 id="description-heading" class="visually-hidden">Leírás</h2>
        <p class="multiline-text">{{ recipe.description }}</p>
      </section>

      <mat-divider aria-hidden="true"></mat-divider>

      <!-- Ingredients -->
      <section aria-labelledby="ingredients-heading">
        <h3 id="ingredients-heading">Hozzávalók</h3>
        <mat-list class="ingredients-list">
          <mat-list-item *ngFor="let item of recipe.ingredients" class="ingredient-item">
            <mat-checkbox
              [checked]="isIngredientChecked(item)"
              (change)="toggleIngredient(item, $event.checked)"
              aria-label="Hozzávaló kiválasztása"
            >
              <span class="multiline-text">{{ item }}</span>
            </mat-checkbox>
          </mat-list-item>
        </mat-list>
      </section>

      <mat-divider aria-hidden="true"></mat-divider>

      <!-- Preparation steps -->
      <section aria-labelledby="steps-heading">
        <h3 id="steps-heading">Elkészítés</h3>
        <mat-list class="steps-list">
          <mat-list-item *ngFor="let step of recipe.steps; let i = index" class="step-item">
            <div mat-line class="step-content">
              <span class="step-number">{{ i + 1 }}.</span>
              <span class="multiline-text">{{ step }}</span>
            </div>
          </mat-list-item>
        </mat-list>
      </section>
    </mat-card-content>
  </mat-card>
</ng-container>

<!-- Not found template -->
<ng-template #notFound>
  <div class="not-found">
    <h2>Recept nem található</h2>
    <p>ID: {{ recipeId }}</p>
    <button mat-raised-button (click)="goBack()">vissza a receptekhez</button>
  </div>
</ng-template>
